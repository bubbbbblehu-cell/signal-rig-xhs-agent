<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2522">
<title>Signal Rig · 照片装置</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="studio">
<section class="stage" aria-label="可旋转的八屏照片装置">
<div id="viewport" aria-label="拖动旋转装置，点击屏幕选照片"></div>
<div id="fallback" hidden></div>
</section>
<section class="controls" aria-label="装置操作">
<p id="status" role="status" aria-live="polite">点屏幕放照片</p>
<div class="toolbar">
<button id="upload-batch" type="button">＋ 批量上传</button>
<button id="rotation-toggle" type="button" aria-label="暂停自动旋转" aria-pressed="true">暂停旋转</button>
<details id="more-tools"><summary aria-label="更多操作">···</summary><div class="tool-panel">
<div id="themes" class="themes" role="group" aria-label="背景颜色"></div>
<div class="actions"><button id="shuffle" type="button">打乱</button><button id="reset-view" type="button">正面</button><button id="build" type="button">生成图片</button><button id="save" type="button">保存</button></div>
</div></details>
</div>
<div id="channels" hidden></div><span id="count" hidden></span>
</section>
</main>
<input id="photos" type="file" accept="image/*" hidden>
<section id="output" class="output" role="dialog" aria-modal="true" aria-label="装置图片预览" hidden>
<header><span>YOUR SIGNAL / 1200 × 1600</span><button id="close-output" type="button" aria-label="关闭预览">×</button></header>
<img id="output-image" alt="生成的 Signal Rig 照片装置">
<div class="output-actions"><button id="edit" type="button">继续调整</button><button id="save-output" class="primary" type="button">保存图片</button></div>
<p id="save-status" role="status" aria-live="polite"></p>
</section>
<!-- RIG_SCRIPTS -->
<script src="./app.js"></script>
</body></html>
