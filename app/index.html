<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2522">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'">
<title>Signal Rig · 照片装置</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="studio">
<header class="masthead"><div class="wordmark">SIGNAL <i>RIG</i></div><span class="edition">PHOTO OBJECT / 001</span></header>
<section class="stage" aria-label="可旋转的八屏照片装置">
<div class="stage-mark">MULTI-FACE<br>SIGNAL OBJECT</div>
<div id="viewport" aria-label="拖动旋转装置，点击屏幕选照片"></div>
<div id="fallback" hidden></div>
<div class="stage-foot"><span id="count">00 / 08 PHOTOS</span><button id="reset-view" type="button">↺ 正面</button></div>
</section>
<section class="controls" aria-label="装置操作">
<p id="status" role="status" aria-live="polite">点击任意屏幕放入照片 · 拖动旋转</p>
<div id="channels" class="channels" aria-label="选择屏幕上传照片"></div>
<div class="actions"><button id="shuffle" type="button"><span>SHUFFLE</span><small>打乱照片</small></button><button id="build" type="button"><span>BUILD</span><small>生成装置图</small></button><button id="save" class="primary" type="button"><span>SAVE</span><small>保存图片</small></button></div>
<p class="privacy">照片只在你的设备上处理</p>
</section>
</main>
<input id="photos" type="file" accept="image/*" multiple hidden>
<section id="output" class="output" role="dialog" aria-modal="true" aria-label="装置图片预览" hidden>
<header><span>YOUR SIGNAL / 1200 × 1600</span><button id="close-output" type="button" aria-label="关闭预览">×</button></header>
<img id="output-image" alt="生成的 Signal Rig 照片装置">
<div class="output-actions"><button id="edit" type="button">继续调整</button><button id="save-output" class="primary" type="button">保存图片</button></div>
<p id="save-status" role="status" aria-live="polite"></p>
</section>
<!-- RIG_SCRIPTS -->
<script src="./app.js"></script>
</body></html>
